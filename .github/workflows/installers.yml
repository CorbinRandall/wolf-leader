name: Installers

# Runs each installer on a fresh Mac, Windows and Linux machine, the way a new user would, and
# checks what it set up. On a release tag it also attaches the Linux download to the release.

on:
  push:
    tags: ["v*"]
    branches: [dev, main]
    paths:
      - "installer/**"
      - "examples/**"
      - ".github/workflows/installers.yml"
  pull_request:
    paths:
      - "installer/**"
      - "examples/**"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Linux download
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v=0.0.0; fi
          bash installer/linux/build-linux.sh "$v"

      - name: Set up a new hub on this machine, as a new user would
        run: |
          set -e
          cd "$RUNNER_TEMP"
          tar xzf "$GITHUB_WORKSPACE"/dist/WolfLeader-linux-*.tar.gz
          cat > answer.ini <<'INI'
          [wolf]
          format=1
          os=linux
          hub_url=http://localhost:6971
          mcp_url=http://localhost:6972/mcp
          timezone=America/Chicago
          device_name=ci-linux
          [detected]
          git=yes
          python=yes
          python_version=3.12.3
          docker=yes
          obsidian=no
          cursor=yes
          claude_code=yes
          wolf_client=no
          [backup]
          done=no
          path=NONE
          files=0
          [original]
          found=no
          where=NONE
          folder=NONE
          ssh_target=NONE
          ssh_port=NONE
          ssh_key=NONE
          INI
          sed -i 's/^ *//' answer.ini
          ./wolf-leader/wolf-leader-setup --ini answer.ini --mode new --toggles client,prereqs,wiki \
            --git-name "CI" --git-email ci@example.com --yes

      - name: Check the hub and the AI tool setup
        run: |
          set -e
          curl -fsS http://localhost:6971/health | grep -q '"healthy"'
          test -f ~/.cursor/mcp.json && grep -q wolf-leader ~/.cursor/mcp.json
          test -f ~/.claude/skills/wolfhowl/SKILL.md
          grep -q wolf-leader-save.sh ~/.claude/settings.json
          test -f ~/.local/share/applications/wolf-leader.desktop

      - name: A Claude Code chat saves itself through the hook
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/chat"
          T="$RUNNER_TEMP/chat/ci-chat.jsonl"
          printf '%s\n' \
            '{"type":"user","message":{"role":"user","content":"Testing the Linux install: does this chat reach Wolf Leader by itself?"},"timestamp":"2026-10-15T04:00:00Z"}' \
            '{"type":"assistant","message":{"role":"assistant","content":[{"type":"text","text":"Yes, the save hook sends it."}]}}' >"$T"
          printf '{"session_id":"ci-linux-hook-test","transcript_path":"%s","cwd":"%s","hook_event_name":"Stop"}' "$T" "$RUNNER_TEMP" \
            | ~/.claude/hooks/wolf-leader-save.sh
          for i in $(seq 1 60); do [ -d ~/.claude/.wolf-leader-save.lock ] || break; sleep 2; done
          cat ~/.claude/wolf-leader-last-save-error.log 2>/dev/null || true
          head -c 1500 ~/.claude/wolf-leader-last-save.json 2>/dev/null || true
          curl -fsS -X POST http://localhost:6971/api/sessions/known -H 'Content-Type: application/json' \
            -d '{"ids":["ci-linux-hook-test"]}' | grep -q ci-linux-hook-test

      - name: Running setup again changes nothing it should not
        run: |
          cd "$RUNNER_TEMP"
          ./wolf-leader/wolf-leader-setup --ini answer.ini --mode update --toggles client --yes
          test "$(grep -c wolf-leader-save.sh ~/.claude/settings.json)" = 2

      - name: Attach the Linux download to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/WolfLeader-linux-*.tar.gz --clobber

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: bash installer/mac/build-app.sh 0.0.0 --app-only

      - name: The app starts and keeps running
        run: |
          APP="dist/Wolf Leader.app"
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info.plist" CFBundleExecutable)"
          "$BIN" & PID=$!
          sleep 15
          kill -0 "$PID"
          kill "$PID"

      - name: Connect to a hub, as a new user would
        run: |
          set -e
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          cat > "$RUNNER_TEMP/answer.ini" <<'INI'
          [wolf]
          format=1
          os=mac
          hub_url=http://127.0.0.1:6971
          mcp_url=http://127.0.0.1:6972/mcp
          timezone=America/Chicago
          device_name=ci-mac
          [detected]
          git=yes
          python=yes
          python_version=3.12.0
          docker=no
          obsidian=no
          cursor=yes
          claude_code=yes
          wolf_client=no
          [backup]
          done=no
          path=NONE
          files=0
          [original]
          found=no
          where=NONE
          folder=NONE
          ssh_target=NONE
          ssh_port=NONE
          ssh_key=NONE
          INI
          sed -i '' 's/^ *//' "$RUNNER_TEMP/answer.ini"
          # No hub runs on the test machine, so the final check warns; everything else must be ok.
          bash "dist/Wolf Leader.app/Contents/Resources/payload/installer/mac/install.sh" \
            --ini "$RUNNER_TEMP/answer.ini" --mode connect --toggles client \
            --git-name CI --git-email ci@example.com --result "$RUNNER_TEMP/result.ini"
          cat "$RUNNER_TEMP/result.ini"
          grep -q '^status=ok' "$RUNNER_TEMP/result.ini"
          grep -q wolf-leader "$HOME/.cursor/mcp.json"
          grep -q wolf-leader-save.sh "$HOME/.claude/settings.json"
          bash "$(ls -d "$HOME/Library/Application Support/WolfLeader"/backup-*)/restore.sh" -y
          test ! -e "$HOME/.cursor/mcp.json"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build the installer
        shell: powershell
        run: |
          cmd /c installer\windows\build.bat 0.0.0
          if (-not (Test-Path "dist\WolfLeaderSetup-0.0.0.exe")) { throw "installer was not built" }

      - name: Write a test answer file
        shell: powershell
        run: |
          $ini = @"
          [wolf]
          format=1
          os=windows
          hub_url=http://127.0.0.1:6971
          mcp_url=http://127.0.0.1:6972/mcp
          timezone=America/Chicago
          device_name=ci-windows
          [detected]
          git=yes
          python=yes
          python_version=3.12.0
          docker=no
          obsidian=no
          cursor=yes
          claude_code=yes
          wolf_client=no
          [backup]
          done=no
          path=NONE
          files=0
          "@
          ($ini -split "`n" | ForEach-Object { $_.Trim() }) -join "`r`n" | Set-Content "$env:RUNNER_TEMP\answer.ini" -Encoding UTF8

      - name: The installer accepts the answer file
        shell: powershell
        run: |
          $out = "$env:RUNNER_TEMP\validate.txt"
          Start-Process -Wait "dist\WolfLeaderSetup-0.0.0.exe" -ArgumentList "/CURRENTUSER", "/WLVALIDATE=$env:RUNNER_TEMP\answer.ini", "/WLRESULT=$out"
          $r = Get-Content $out -Raw
          Write-Output $r
          if (-not $r.StartsWith("OK")) { throw "answer file rejected: $r" }

      - name: Start a stand-in hub that answers health checks
        shell: powershell
        run: |
          $py = @'
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"status": "healthy", "service": "wolf-leader", "database": {"ok": True}}).encode()
                  self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
              def log_message(self, *a): pass
          http.server.HTTPServer(("127.0.0.1", 6971), H).serve_forever()
          '@
          ($py -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n" | Set-Content "$env:RUNNER_TEMP\hub.py"
          Start-Process python -ArgumentList "$env:RUNNER_TEMP\hub.py" -WindowStyle Hidden
          Start-Sleep 3
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:6971/health).Content

      - name: Connect to a hub, as a new user would
        shell: powershell
        run: |
          $result = "$env:RUNNER_TEMP\result.ini"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\install.ps1 `
            -Config "$env:RUNNER_TEMP\answer.ini" -Mode connect -Client -GitName CI -GitEmail ci@example.com -ResultFile $result
          Get-Content $result
          if (-not (Select-String -Path $result -Pattern '^ok=1' -Quiet)) { throw "install reported errors" }
          if (-not (Select-String -Path "$HOME\.cursor\mcp.json" -Pattern 'wolf-leader' -Quiet)) { throw "Cursor was not connected" }
