name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wolf
          POSTGRES_PASSWORD: wolf
          POSTGRES_DB: wolf_leader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolf -d wolf_leader"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql://wolf:wolf@127.0.0.1:5432/wolf_leader
        run: pytest -q

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: self-hosted
    steps:
      - name: Update Proxmox host checkout
        run: |
          set -euo pipefail
          cd /opt/wolf-leader
          git fetch origin
          git checkout main
          git pull --ff-only origin main

      - name: Deploy to LXC
        env:
          WOLF_LEADER_VMID: ${{ vars.WOLF_LEADER_VMID }}
        run: WOLF_LEADER_BRANCH=main bash /opt/wolf-leader/scripts/deploy-wolf-leader-lxc.sh
